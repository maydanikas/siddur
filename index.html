<!doctype html>
<html lang="en" style="background-color:#0D9488">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shacharis" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    <title>Shacharis</title>
    <style>
      html, body { background:#0D9488; margin:0; padding:0; }
      #root { min-height:100dvh; }
      /* Bridge splash for browser tabs only — in installed PWA the OS already shows one */
      #static-splash {
        position:fixed; inset:0;
        background:#0D9488;
        z-index:99999;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      #static-splash .shin {
        color:white;
        font-size:160px;
        line-height:1;
        font-family:serif;
      }
      #static-splash .label {
        position:absolute;
        bottom:64px;
        color:white;
        font-size:32px;
        letter-spacing:6px;
        font-family:system-ui,sans-serif;
      }
      @media (display-mode: standalone) {
        #static-splash { display:none; }
      }
    </style>
  </head>
  <body style="background-color:#0D9488;margin:0">
    <div id="static-splash" aria-hidden="true">
      <span class="shin">ש</span>
      <span class="label">SHAHARIS</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
